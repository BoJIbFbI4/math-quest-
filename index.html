<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Math Quest">
<meta name="theme-color" content="#fbfdff">
<title>Math Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="stars"></div>
  <div class="sun"></div>
  <div class="cloud" style="top: 9vh; --w: 22vmin; --t: 75s; --dl: -20s"></div>
  <div class="cloud" style="top: 20vh; --w: 15vmin; --t: 100s; --dl: -65s"></div>
  <div class="cloud" style="top: 33vh; --w: 26vmin; --t: 130s; --dl: -100s"></div>
  <div class="floaters" id="floaters"></div>
  <svg class="hill hill-back" viewBox="0 0 1440 200" preserveAspectRatio="none"><path d="M0 120 C 240 40 480 40 720 110 S 1200 180 1440 90 V200 H0 Z"/></svg>
  <svg class="hill hill-front" viewBox="0 0 1440 200" preserveAspectRatio="none"><path d="M0 150 C 300 80 520 170 820 125 S 1260 70 1440 140 V200 H0 Z"/></svg>
</div>
<div id="app"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<noscript>Math Quest needs JavaScript.</noscript>
<!-- Load order matters: core first, then languages and topics (topics appear on the home screen in this order), app last. -->
<script src="js/core.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/ru.js"></script>
<script src="js/i18n/it.js"></script>
<script src="js/viz.js"></script>
<script src="js/topics/add.js"></script>
<script src="js/topics/sub.js"></script>
<script src="js/topics/missing.js"></script>
<script src="js/topics/place.js"></script>
<script src="js/topics/mul.js"></script>
<script src="js/topics/story.js"></script>
<script src="js/session.js"></script>
<script src="js/store.js"></script>
<script src="js/fx.js"></script>
<script src="js/app.js"></script>
</body>
</html>
